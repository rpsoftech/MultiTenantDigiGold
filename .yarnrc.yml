approvedGitRepositories:
  - "**"

# Pinned so every machine writes the same yarn.lock checksums (cacheKey 10c0, Yarn 4's
# default). Without it a global `compressionLevel: mixed` rewrites every checksum.
compressionLevel: 0

enableGlobalCache: true

enableScripts: true

nodeLinker: node-modules

npmMinimalAgeGate: 0

npmScopes:
  rps:
    npmAlwaysAuth: false
    npmPublishRegistry: "https://npmjs.rpso.in"
    npmRegistryServer: "https://npmjs.rpso.in"

yarnPath: .yarn/releases/yarn-4.17.0.cjs
