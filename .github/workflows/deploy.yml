name: Digi Gold Deployment Pipeline

on:
  push:
    branches:
      - main
      - staging

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Deploy Staging
        if: github.ref == 'refs/heads/staging'
        env:
          FILE_SERVER_TOKEN: ${{ secrets.FILE_SERVER_TOKEN }}
          KV_TOKEN: ${{ secrets.KV_TOKEN }}
          DEPLOY_ENV: STAGING
        run: go run packages/servers/MainServerGo/scripts/deploy.go

      - name: Deploy Production
        if: github.ref == 'refs/heads/main'
        env:
          FILE_SERVER_TOKEN: ${{ secrets.FILE_SERVER_TOKEN }}
          KV_TOKEN: ${{ secrets.KV_TOKEN }}
          DEPLOY_ENV: PRODUCTION
        run: go run scripts/deploy.go
