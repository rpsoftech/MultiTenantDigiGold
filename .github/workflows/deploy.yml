name: Digi Gold Deployment Pipeline

on:
  push:
    branches:
      - main
      - staging
    # Every deploy bumps the version and restarts every server, so only deploy when
    # something that goes into the binaries changed.
    paths:
      - 'packages/servers/MainServerGo/**'
      - '!packages/servers/MainServerGo/**/*_test.go'
      - '!packages/servers/MainServerGo/**/*.md'
      - '!packages/servers/MainServerGo/Dockerfile'
      - '!packages/servers/MainServerGo/docker-compose.yml'
      - '!packages/servers/MainServerGo/digiGold.env_example'
      - '!packages/servers/MainServerGo/project.json'
      - '!packages/servers/MainServerGo/*.postman_collection.json'
      - '!packages/servers/MainServerGo/api_collection.json'
      - '!packages/servers/MainServerGo/cmd/dbtool/**' # not deployed (deploy.go builds api and worker)
      - 'go.work'
      - 'go.work.sum'
      - '.github/workflows/deploy.yml'

# Deploy runs read the current version and publish a higher one, so they must not overlap.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

# Both targets upload to the same file server and key-value store (only the key prefix,
# STAGING_ or PRODUCTION_, differs), so both jobs read the tokens from the Staging
# environment.
jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: packages/servers/MainServerGo/go.sum

      # Deploy starts on the push, without waiting for the Backend Tests workflow, so a
      # build that fails vet or the unit tests must stop here, before anything is published.
      - name: Vet and unit tests
        working-directory: packages/servers/MainServerGo
        run: go vet ./... && go test -count=1 ./...

      - name: Deploy Staging
        env:
          FILE_SERVER_TOKEN: ${{ secrets.FILE_SERVER_TOKEN }}
          KV_TOKEN: ${{ secrets.KV_TOKEN }}
          DEPLOY_ENV: STAGING
        run: go run packages/servers/MainServerGo/scripts/deploy.go

  # Uses the Staging environment's FILE_SERVER_TOKEN and KV_TOKEN (the Production environment
  # has none). For a separate approval step on production deploys, add the two secrets to a
  # "Production" environment with required reviewers and point this job at it.
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: packages/servers/MainServerGo/go.sum

      # Deploy starts on the push, without waiting for the Backend Tests workflow, so a
      # build that fails vet or the unit tests must stop here, before anything is published.
      - name: Vet and unit tests
        working-directory: packages/servers/MainServerGo
        run: go vet ./... && go test -count=1 ./...

      - name: Deploy Production
        env:
          FILE_SERVER_TOKEN: ${{ secrets.FILE_SERVER_TOKEN }}
          KV_TOKEN: ${{ secrets.KV_TOKEN }}
          DEPLOY_ENV: PRODUCTION
        run: go run packages/servers/MainServerGo/scripts/deploy.go
