name: Digi Gold Deployment Pipeline

on:
  push:
    branches:
      - main
      - staging

# Each target has its own GitHub environment, so production can have its own secrets and
# protection rules (required reviewers) instead of borrowing staging's.
jobs:
  deploy-staging:
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    environment: Staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Deploy Staging
        env:
          FILE_SERVER_TOKEN: ${{ secrets.FILE_SERVER_TOKEN }}
          KV_TOKEN: ${{ secrets.KV_TOKEN }}
          DEPLOY_ENV: STAGING
        run: go run packages/servers/MainServerGo/scripts/deploy.go

  # Needs a "Production" environment in the repository settings with FILE_SERVER_TOKEN and
  # KV_TOKEN set (and, ideally, required reviewers). Without those secrets the deploy script
  # stops before uploading anything.
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Deploy Production
        env:
          FILE_SERVER_TOKEN: ${{ secrets.FILE_SERVER_TOKEN }}
          KV_TOKEN: ${{ secrets.KV_TOKEN }}
          DEPLOY_ENV: PRODUCTION
        run: go run packages/servers/MainServerGo/scripts/deploy.go
