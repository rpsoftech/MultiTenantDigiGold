                properties:
                  success: { type: boolean }
                  message: { type: string }
                  trade: { $ref: '#/components/schemas/LedgerEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already collected or cancelled (`REDEMPTION_NOT_PENDING`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

