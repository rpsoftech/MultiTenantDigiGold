      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
        '403':
          description: User not in this tenant.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }

  /admin/store/kyc/reject:
    post:
