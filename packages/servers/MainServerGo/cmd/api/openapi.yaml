      responses:
        '200':
          description: Pending redemptions, oldest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Paginated'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Redemption' }

  /admin/store/redemptions/collect:
    post:
      operationId: postAdminStoreRedemptionsCollect
      tags: [Admin Store]
      summary: Hand physical gold to the customer
      description: The customer's pickup code must match. Only a `PENDING` request can be collected.
      security: [{ AdminToken: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redemption_uuid, pickup_code]
              properties:
                redemption_uuid: { type: string, format: uuid }
                pickup_code: { type: string, example: '483920' }
      responses:
        '200':
          description: Collected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  redemption: { $ref: '#/components/schemas/Redemption' }
        '400':
          description: Missing fields or wrong pickup code (`INVALID_PICKUP_CODE`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already collected or cancelled (`REDEMPTION_NOT_PENDING`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /admin/store/redemptions/cancel:
    post:
      operationId: postAdminStoreRedemptionsCancel
