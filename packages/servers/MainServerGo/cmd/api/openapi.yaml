                  limit: { type: integer }

  # ------------------------------------------------------------------ Webhooks
  /webhook/razorpay:
    post:
      operationId: postWebhookRazorpay
      tags: [Webhooks]
      security: []
      summary: Razorpay payment webhook
      description: |
        Configure in the Razorpay dashboard with event `payment.captured`.
        Verified with `X-Razorpay-Signature` and the tenant's `webhook_secret`.
        Only `payment.captured` credits gold; every other event returns `ignored`.
        The paid amount must equal the order amount. Safe to retry: each payment is processed once.
      parameters:
        - name: X-Razorpay-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Standard Razorpay webhook payload.
      responses:
        '200':
          description: Processed or ignored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, ignored] }
        '400':
          description: Bad signature or payload.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
        '500':
          description: Trade failed. Razorpay retries.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleError' }
