openapi: 3.0.0
info:
  title: DigiGold Platform API
  version: '1.0.0'
  description: Multi-tenant digital gold exchange with OTP Auth, Trading, Admin Dashboards, and Webhooks.
servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantIdHeader:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        example: '7e57d004-2b97-0e7a-b45f-5387367791cd'
      description: The UUID of the tenant running the request

paths:
  /auth/otp/request:
    post:
      summary: Request an OTP for a phone number
      tags: [Auth]
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  example: '+919876543210'
      responses:
        '200':
          description: OTP sent

  /auth/otp/verify:
    post:
      summary: Verify OTP and get JWT or Registration Token
      tags: [Auth]
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                otp:
                  type: string
      responses:
        '200':
          description: Returns `is_registered`, and either JWT tokens (if true) or `registration_token` (if false).

  /auth/register:
    post:
      summary: Register a new user using a registration token
      tags: [Auth]
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                registration_token:
                  type: string
                full_name:
                  type: string
                email_id:
                  type: string
      responses:
        '200':
          description: Registration successful, returns JWT tokens

  /user/portfolio:
    get:
      summary: Get user gold balance and live valuation
      tags: [Customer]
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success

  /trade/buy/initiate:
    post:
      summary: Initiate a gold purchase
      tags: [Customer]
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                requested_rate_per_gram:
                  type: number
                  example: 7100.5
                total_amount_inr:
                  type: number
                  example: 5000.0
      responses:
        '200':
          description: Returns razorpay order_id

  /trade/sell:
    post:
      summary: Sell digital gold for cash
      tags: [Customer]
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                requested_rate_per_gram:
                  type: number
                weight_grams:
                  type: number
      responses:
        '200':
          description: Trade executed

  /user/kyc:
    post:
      summary: Upload KYC Document
      tags: [Customer]
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                document_type:
                  type: string
                  example: PAN
                document_url:
                  type: string
                  example: https://s3.aws.com/doc
      responses:
        '200':
          description: KYC Pending

  /admin/store/customers:
    get:
      summary: Get all customers in tenant
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of customers

  /admin/store/analytics:
    get:
      summary: Get B2B analytics
      tags: [Admin]
      parameters:
        - $ref: '#/components/parameters/TenantIdHeader'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Total volume, revenue, margin

  /webhook/razorpay:
    post:
      summary: Public webhook for Razorpay
      tags: [Webhooks]
      responses:
        '200':
          description: Trade executed
