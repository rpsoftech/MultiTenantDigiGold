version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: digigold_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: digigold_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./posgrest.scema.sql:/docker-entrypoint-initdb.d/posgrest.scema.sql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: digigold_redis
    ports:
      - '6379:6379'
    volumes:
      - redisdata:/data
    command: ['redis-server', '--appendonly', 'yes']
    restart: unless-stopped

  api:
    build: .
    container_name: digigold_api
    ports:
      - '8080:8080'
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=adminpassword
      - DB_NAME=digigold_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=8080
      - JWT_SECRET=super_secret_jwt_key_for_production
    depends_on:
      - db
      - redis
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
